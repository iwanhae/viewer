[project]
name = "viewer-worker"
version = "0.1.0"
description = "External embedding and WebP workers for viewer"
readme = "README.md"
authors = [
    { name = "iwanhae", email = "iwanhae@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
recommender = "recommender.cli:main"
encoder = "encoder.cli:main"

[tool.uv.build-backend]
module-name = ["recommender", "encoder", "worker_common"]

# torch is resolved from the index matching the machine it is synced on;
# the extras are mutually exclusive so only one build can be in the venv.
[project.optional-dependencies]
cpu = ["torch>=2.7", "numpy>=1.26", "pillow>=10.1", "safetensors>=0.4"]
cu126 = ["torch>=2.7", "numpy>=1.26", "pillow>=10.1", "safetensors>=0.4"]
cu128 = ["torch>=2.7", "numpy>=1.26", "pillow>=10.1", "safetensors>=0.4"]
# Blackwell-class devices such as DGX Spark (GB10, aarch64) ship CUDA 13
# drivers and need the cu130 wheels.
cu130 = ["torch>=2.7", "numpy>=1.26", "pillow>=10.1", "safetensors>=0.4"]
# probe = scripts/eg2-probe phases (EmbeddingGemma 2 via transformers); the
# production recommender itself does not need transformers.
probe = ["transformers>=5.19", "tokenizers>=0.22", "scikit-learn>=1.5"]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cu126" }, { extra = "cu128" }, { extra = "cu130" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
