name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches: [ "main" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  RECOMMENDER_IMAGE_NAME: ${{ github.repository }}-recommender
  SIGLIP2_MODEL_ID: google/siglip2-base-patch16-224
  RECOMMENDER_ACCEL: mkl
  VIEWER_CACHE_IMAGE: ghcr.io/${{ github.repository }}:buildcache-viewer
  RECOMMENDER_CACHE_IMAGE: ghcr.io/${{ github.repository }}-recommender:buildcache-recommender

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the cosign tool.
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: 'v2.2.4'

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache.
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Login against the Docker registry.
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for viewer image.
      # https://github.com/docker/metadata-action
      - name: Extract viewer Docker metadata
        id: viewer-meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Extract metadata (tags, labels) for recommender image.
      # https://github.com/docker/metadata-action
      - name: Extract recommender Docker metadata
        id: recommender-meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.RECOMMENDER_IMAGE_NAME }}

      # Build and push viewer image with Buildx.
      # https://github.com/docker/build-push-action
      - name: Build and push viewer image
        id: build-and-push-viewer
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          target: runtime-viewer
          push: true
          tags: ${{ steps.viewer-meta.outputs.tags }}
          labels: ${{ steps.viewer-meta.outputs.labels }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.VIEWER_CACHE_IMAGE }}
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.VIEWER_CACHE_IMAGE }},mode=max,image-manifest=true,oci-mediatypes=true

      # Build and push recommender image with Buildx.
      # https://github.com/docker/build-push-action
      - name: Build and push recommender image
        id: build-and-push-recommender
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          target: runtime-recommender
          push: true
          tags: ${{ steps.recommender-meta.outputs.tags }}
          labels: ${{ steps.recommender-meta.outputs.labels }}
          build-args: |
            SIGLIP2_MODEL_ID=${{ env.SIGLIP2_MODEL_ID }}
            RECOMMENDER_ACCEL=${{ env.RECOMMENDER_ACCEL }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.RECOMMENDER_CACHE_IMAGE }}
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.RECOMMENDER_CACHE_IMAGE }},mode=max,image-manifest=true,oci-mediatypes=true

      # Sign the published viewer image.
      # https://github.com/sigstore/cosign
      - name: Sign the published viewer image
        env:
          TAGS: ${{ steps.viewer-meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push-viewer.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

      # Sign the published recommender image.
      # https://github.com/sigstore/cosign
      - name: Sign the published recommender image
        env:
          TAGS: ${{ steps.recommender-meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push-recommender.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
