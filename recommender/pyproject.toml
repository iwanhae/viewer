[project]
name = "recommender"
version = "0.1.0"
description = "External embedding worker for the viewer photo server"
readme = "README.md"
authors = [
    { name = "iwanhae", email = "iwanhae@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10.1",
    "safetensors>=0.4",
]

[project.scripts]
recommender = "recommender.cli:main"

# torch is resolved from the index matching the machine it is synced on;
# the extras are mutually exclusive so only one build can be in the venv.
[project.optional-dependencies]
cpu = ["torch>=2.7"]
cu126 = ["torch>=2.7"]
cu128 = ["torch>=2.7"]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cu126" }, { extra = "cu128" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
