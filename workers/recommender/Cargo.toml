[package]
name = "recommender"
version = "0.1.0"
edition = "2021"

[features]
default = []
mkl = ["candle/mkl"]

[dependencies]
anyhow = "1.0"
base64 = "0.22.1"
candle = { package = "candle-core", version = "0.9.2" }
candle-nn = "0.9.2"
candle-transformers = "0.9.2"
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq"] }
half = "2.7.1"
image = { version = "0.25.5", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
