[package]
name = "reco-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
base64 = "0.22.1"
candle = { package = "candle-core", version = "0.9.2" }
candle-nn = "0.9.2"
candle-transformers = "0.9.2"
hf-hub = "0.4.1"
image = { version = "0.25.5", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
